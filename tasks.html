<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tasks</title>
    <link rel="stylesheet" href="css/reset.css" />
    <style>
      .gallery {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
      }

      .gallery-image {
        width: 320px;
      }

      #validation-input {
        border: 3px solid #bdbdbd;
      }

      #validation-input.valid {
        border-color: #4caf50;
      }

      #validation-input.invalid {
        border-color: #f44336;
      }
    </style>
  </head>
  <body>
    <p><a href="/index.html">To the main page</a></p>

    <h1>My tasks</h1>

    <ul id="categories">
      <li class="item">
        <h2>Animals</h2>
        <ul>
          <li>Cat</li>
          <li>Hamster</li>
          <li>Horse</li>
          <li>Parrot</li>
        </ul>
      </li>
      <li class="item">
        <h2>Products</h2>
        <ul>
          <li>Bread</li>
          <li>Prasley</li>
          <li>Cheese</li>
        </ul>
      </li>
      <li class="item">
        <h2>Technologies</h2>
        <ul>
          <li>HTML</li>
          <li>CSS</li>
          <li>JavaScript</li>
          <li>React</li>
          <li>Node.js</li>
        </ul>
      </li>
    </ul>

    <ul id="ingredients"></ul>

    <ul class="gallery"></ul>

    <div id="counter">
      <button type="button" data-action="decrement">-1</button>
      <span id="value">0</span>
      <button type="button" data-action="increment">+1</button>
    </div>

    <input type="text" id="name-input" placeholder="Please enter your name" />
    <h1>Hello, <span id="name-output">Anonymous</span>!</h1>

    <input
      type="text"
      id="validation-input"
      data-length="6"
      placeholder="Please enter 6 symbols"
    />

    <input id="font-size-control" type="range" min="16" max="96" />
    <br />
    <span id="text">Abracadabra!</span>

    <script src="js/tasks.js" type="module"></script>
    <script src="js/array-methods.js" type="module"></script>
    <script src="js/reduce.js" type="module"></script>
    <script src="js/test-1.js" type="module"></script>
    <script src="js/test-2.js" type="module"></script>
    <script src="js/test-3.js" type="module"></script>
    <script src="js/test-4.js" type="module"></script>
    <script src="js/test-5.js" type="module"></script>
    <script src="js/test-6.js" type="module"></script>
    <script src="js/test-7.js" type="module"></script>
  </body>
</html>
